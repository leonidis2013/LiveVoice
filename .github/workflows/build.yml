name: Build LiveVoice VST3

# Builds the plugin for Windows and macOS on every push.
#   - Every push to main: the "Latest build" release on the project's front page is replaced,
#     with LiveVoice-macOS-VST3.zip and LiveVoice-Windows-VST3.zip attached. Always-newest links:
#     https://github.com/<owner>/<repo>/releases/latest/download/LiveVoice-macOS-VST3.zip
#   - Push a tag like v0.7.0: also keeps a permanent release for that version
#   - Every run: Actions tab > the run > Artifacts (same files)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create Releases on tags

jobs:
  build:
    name: ${{ matrix.name }} VST3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from CMakeLists.txt
        id: version
        shell: bash
        run: |
          v=$(sed -n 's/^project(LiveVoice VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building LiveVoice $v"

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Zip the plugin
        shell: bash
        run: |
          cd build/LiveVoice_artefacts/Release/VST3
          cmake -E tar cf "$GITHUB_WORKSPACE/LiveVoice-${{ matrix.name }}-VST3.zip" --format=zip LiveVoice.vst3

      - name: Build the Mac installer (.pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          installer/mac/build-pkg.sh "${{ steps.version.outputs.version }}" build/LiveVoice_artefacts/Release/VST3/LiveVoice.vst3 LiveVoice-macOS-Installer.pkg > pkg.log 2>&1
          status=$?
          cat pkg.log
          if [ $status -ne 0 ]; then tail -25 pkg.log | sed 's/^/::error::/'; fi
          exit $status

      - name: Build the Windows installer (.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceVst3=$PWD\build\LiveVoice_artefacts\Release\VST3\LiveVoice.vst3" "/DOutputDir=$PWD" installer\windows\LiveVoice.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveVoice-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: |
            LiveVoice-${{ matrix.name }}-VST3.zip
            LiveVoice-${{ matrix.name }}-Installer.*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        shell: bash
        run: |
          v=$(sed -n 's/^project(LiveVoice VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          {
            echo "**LiveVoice $v** - built $(date -u '+%Y-%m-%d %H:%M UTC') from \`${GITHUB_SHA::7}\`: $(git log -1 --pretty=%s)"
            echo
            echo "### Mac: LiveVoice-macOS-Installer.pkg"
            echo "1. Quit LiveProfessor (or any host), download the installer and double-click it."
            echo "2. If macOS says it can't verify the installer: click **Done**, open **System Settings > Privacy & Security**, scroll down and click **Open Anyway** next to LiveVoice-macOS-Installer.pkg, then enter your password. (Needed once per download until the installer is signed with an Apple Developer ID.)"
            echo "3. Click through the installer. It removes old LiveVoice copies, installs into /Library/Audio/Plug-Ins/VST3 and clears the macOS download block - no Terminal command needed."
            echo "4. Reopen your host and rescan plug-ins."
            echo
            echo "### Windows: LiveVoice-Windows-Installer.exe"
            echo "1. Close your host, download the installer and run it."
            echo "2. If Windows shows **Windows protected your PC**, click **More info > Run anyway**, then **Yes** for administrator permission."
            echo "3. Click through. It removes old LiveVoice copies and installs into C:\\Program Files\\Common Files\\VST3. It can be removed later from Settings > Apps."
            echo "4. Reopen your host and rescan plug-ins."
            echo
            echo "The plain zips are still here for manual installs (see the README)."
            echo "After installing, the version under the LiveVoice logo should read v$v."
          } > notes.md

      - name: Replace the "Latest build" release (main)
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build dist/* --target "$GITHUB_SHA" \
            --title "Latest build - LiveVoice $VERSION" --notes-file notes.md --latest

      - name: Permanent release for a version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "LiveVoice $GITHUB_REF_NAME" --notes-file notes.md --latest=false

  tests:
    name: Offline tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLIVEVOICE_BUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --config Release --target LiveVoiceTests --parallel
      - name: Run tests
        shell: bash
        run: |
          set +e
          ./build/Tests/LiveVoiceTests_artefacts/Release/LiveVoiceTests | tee test-output.txt
          status=${PIPESTATUS[0]}
          # failing checks (with the measurement line above each) become annotations on the run page
          grep -B2 "FAIL" test-output.txt | sed 's/^/::error::/' || true
          tail -1 test-output.txt | sed 's/^/::notice::/'
          exit $status
